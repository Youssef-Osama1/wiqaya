name: wiqaya

services:
  pgvector:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    container_name: wiqaya-pgvector
    ports:
      - "5500:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wiqaya}
    volumes:
      - pgvector_data:/var/lib/postgresql
    networks:
      - wiqaya
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.18
    container_name: wiqaya-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - wiqaya
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  wiqaya:
    driver: bridge

volumes:
  pgvector_data:
  qdrant_data:
