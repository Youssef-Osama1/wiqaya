            - generic [ref=f1e113]: Recommendation
            - paragraph [ref=f1e120]: The target blood pressure for adults with hypertension varies based on age, comorbidities, and the method of measurement. For adults under 80, the clinic blood pressure target is below 140/90 mmHg, while for those aged 80 and over, it is below 150/90 mmHg. When using home or ambulatory blood pressure monitoring (HBPM/ABPM), the targets are below 135/85 mmHg for adults under 80 and below 145/85 mmHg for those aged 80 and over. For patients with hypertension and known cardiovascular disease, the target systolic blood pressure is <130 mmHg, and for high-risk patients (those with high CVD risk, diabetes mellitus, or chronic kidney disease), a target systolic blood pressure of <130 mmHg is suggested.
